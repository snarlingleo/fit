<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover" />
  <meta name="theme-color" content="#4b4bf9" />
  <meta name="description"
        content="PowerApp — Ton coach de salle personnel" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitTracker" />

  <title>PowerApp</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="./style.css" />
  <script type="module" src="js/firebase.js"></script>
  <script src="js/auth-ui.js"></script>
</head>

<body data-theme="dark">

  <!-- ══════════════════════════════════════════════
       SPLASH SCREEN
  ══════════════════════════════════════════════ -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">🏋️</div>
      <div class="splash-title">PowerApp</div>
      <div class="splash-sub">Mon Coach · Programme</div>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       ONBOARDING
  ══════════════════════════════════════════════ -->
  <div id="onboarding" class="hidden"></div>

  <!-- ══════════════════════════════════════════════
       APP WRAPPER
  ══════════════════════════════════════════════ -->
  <div id="app-wrapper" class="hidden">

    <!-- ── HEADER ────────────────────────────────── -->
    <header class="app-header">
      <div class="header-left">
        <span class="header-logo">🏋️</span>
        <div class="header-titles">
          <span class="header-title">Mon Coach</span>
          <span class="header-phase" id="header-phase">
            Semaine 1 · Phase Reprise
          </span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-icon" id="btn-theme"
                title="Changer le thème"
                aria-label="Thème">
          🌙
        </button>
        <button class="btn-icon" id="btn-profile-quick"
                title="Profil"
                aria-label="Profil">
          💪
        </button>
      </div>
    </header>

    <!-- ── CONTENU PRINCIPAL ─────────────────────── -->
    <main id="page-content" class="page-content">
      <!-- Contenu injecté par JS -->
    </main>

    <!-- ── NAVIGATION ────────────────────────────── -->
    <nav class="bottom-nav" role="navigation"
         aria-label="Navigation principale">

      <button class="nav-item active" data-page="home"
              aria-label="Accueil">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Accueil</span>
      </button>

      <button class="nav-item" data-page="training"
              aria-label="Training">
        <span class="nav-icon">🏋️</span>
        <span class="nav-label">Training</span>
      </button>

      <!-- Bouton central Live -->
      <div class="nav-center">
        <button class="nav-center-btn" data-page="live"
                aria-label="Démarrer une séance">
          <span style="font-size:1.6rem">⚡</span>
        </button>
      </div>

      <button class="nav-item" data-page="nutrition"
              aria-label="Nutrition">
        <span class="nav-icon">🥗</span>
        <span class="nav-label">Nutrition</span>
      </button>

      <button class="nav-item" data-page="profile"
              aria-label="Profil">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profil</span>
      </button>

    </nav>

  </div><!-- fin #app-wrapper -->


  <!-- ══════════════════════════════════════════════
       MODALS
  ══════════════════════════════════════════════ -->

  <!-- Modal Confirmation -->
  <div id="modal-confirm" class="modal hidden" role="dialog"
       aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal-overlay"></div>
    <div class="modal-box">
      <h3 id="modal-confirm-title" class="modal-title">
        Confirmer ?
      </h3>
      <p id="modal-confirm-msg" class="modal-msg"></p>
      <div class="modal-actions">
        <button id="modal-confirm-cancel" class="btn-secondary">
          Annuler
        </button>
        <button id="modal-confirm-ok" class="btn-primary">
          Confirmer
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Info / Contenu -->
  <div id="modal-info" class="modal hidden" role="dialog"
       aria-modal="true">
    <div class="modal-overlay"></div>
    <div class="modal-box modal-box-scroll">
      <button id="modal-info-close"
              class="modal-close"
              aria-label="Fermer">
        ✕
      </button>
      <div id="modal-info-content"></div>
    </div>
  </div>

  <!-- Modal Vidéo YouTube -->
  <div id="modal-video"
       style="display:none;position:fixed;inset:0;
              z-index:9999;align-items:center;
              justify-content:center;
              background:rgba(9,9,45,0.95);
              backdrop-filter:blur(12px);
              padding:var(--space-md)">
  </div>


  <!-- ══════════════════════════════════════════════
       OVERLAYS GLOBAUX
  ══════════════════════════════════════════════ -->

  <!-- Canvas Confetti -->
  <canvas id="confetti-canvas"
          style="position:fixed;inset:0;
                 pointer-events:none;
                 z-index:9998;
                 width:100%;height:100%">
  </canvas>

  <!-- Toast Container -->
  <div id="toast-container"
       role="status" aria-live="polite"
       aria-atomic="false">
  </div>


  <!-- ══════════════════════════════════════════════
       BANNERS
  ══════════════════════════════════════════════ -->

  <!-- Update Banner -->
  <div id="update-banner"
       class="hidden"
       style="position:fixed;top:0;left:0;right:0;
              z-index:9990;
              background:var(--fd-indigo);
              color:white;
              padding:var(--space-sm) var(--space-md);
              display:flex;align-items:center;
              justify-content:space-between;
              font-size:.85rem;font-weight:600;
              box-shadow:0 4px 16px rgba(75,75,249,0.4)">
    <span>🆕 Nouvelle version disponible !</span>
    <button id="btn-update"
            style="background:white;
                   color:var(--fd-indigo);
                   border:none;
                   border-radius:var(--radius-sm);
                   padding:4px 12px;
                   font-weight:700;
                   font-size:.8rem;
                   cursor:pointer">
      Mettre à jour
    </button>
  </div>

  <!-- Install Prompt -->
  <div id="install-prompt"
       class="hidden"
       style="position:fixed;
              bottom:calc(var(--nav-height) + var(--space-md));
              left:var(--space-md);
              right:var(--space-md);
              z-index:9989;
              background:var(--bg-card);
              border:1px solid var(--fd-indigo);
              border-radius:var(--radius-lg);
              padding:var(--space-md);
              display:flex;align-items:center;
              gap:var(--space-md);
              box-shadow:0 8px 32px rgba(75,75,249,0.2)">
    <span style="font-size:1.8rem">📱</span>
    <div style="flex:1">
      <div style="font-weight:700;font-size:.88rem">
        Installer FitTracker
      </div>
      <div style="font-size:.72rem;color:var(--text-muted)">
        Accès rapide depuis ton écran d'accueil
      </div>
    </div>
    <button id="btn-install"
            class="btn-primary"
            style="font-size:.8rem;
                   padding:var(--space-sm) var(--space-md);
                   white-space:nowrap">
      Installer
    </button>
    <button id="btn-install-dismiss"
            style="background:none;border:none;
                   color:var(--text-muted);
                   font-size:1.1rem;cursor:pointer;
                   padding:4px">
      ✕
    </button>
  </div>


  <!-- ══════════════════════════════════════════════
       SCRIPTS — Ordre de chargement IMPORTANT
  ══════════════════════════════════════════════ -->

  <!-- CDN Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Core -->
  <script src="./js/utils.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/programme.js"></script>
  <script src="./js/tracker.js"></script>
  <script src="./js/timer.js"></script>

  <!-- Features -->
  <script src="./js/gamification.js"></script>
  <script src="./js/stats.js"></script>
  <script src="./js/coach.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/nutrition.js"></script>
  <script src="./js/exercice-videos.js"></script>

  <!-- Nouvelles features v2 -->
  <script src="./js/defis.js"></script>
  <script src="./js/share.js"></script>
  <script src="./js/predict.js"></script>
  <script src="./js/auth-ui.js"></script>

  <!-- App — TOUJOURS EN DERNIER -->
  <script src="./js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ('sw' in navigator) {
      window.addEventListener('load', () => {
        navigator.sw
          .register('./sw.js')
          .catch(err => console.warn('SW:', err));
      });
    }
  </script>

</body>
</html>
