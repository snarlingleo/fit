<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 viewport-fit=cover,
                 user-scalable=no" />
  <meta name="theme-color" content="#09092d" />
  <meta name="description"
        content="PowerApp — Ton coach de salle personnel" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style"
        content="black-translucent" />
  <meta name="apple-mobile-web-app-title"
        content="PowerApp" />

  <title>PowerApp ⚡</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon"
        href="./assets/icons/icon-192.png" />

  <!-- CSS -->
  <link rel="stylesheet" href="./css/style.css" />

  <!-- Firebase -->
  <script type="module" src="js/firebase.js"></script>
</head>

<body data-theme="dark">

  <!-- ══════════════════════════════════════════
       SPLASH SCREEN
  ══════════════════════════════════════════ -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">⚡</div>
      <div class="splash-title">PowerApp</div>
      <div class="splash-subtitle">
        Ton coach fitness personnel
      </div>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════
       ONBOARDING
  ══════════════════════════════════════════ -->
  <div id="onboarding-screen" class="onboarding hidden"></div>

  <!-- ══════════════════════════════════════════
       APP WRAPPER
  ══════════════════════════════════════════ -->
  <div id="app-wrapper" style="display:none">

    <!-- HEADER -->
    <header id="app-header" class="app-header">
      <div class="header-left">
        <span id="header-emoji" class="header-emoji">⚡</span>
        <span id="header-title" class="header-title">
          PowerApp
        </span>
      </div>
      <div class="header-right">
        <div id="header-xp"
             class="header-xp"
             onclick="naviguer('gamification')"
             style="cursor:pointer">
        </div>
        <button class="header-icon-btn"
                onclick="UI.toggleMenu()"
                title="Menu">⋮</button>
      </div>
    </header>

    <!-- MENU DROPDOWN -->
    <div id="app-menu" class="app-menu hidden"
         onclick="UI.fermerMenu()">
      <div class="app-menu-inner"
           onclick="event.stopPropagation()">
        <div class="menu-item"
             onclick="naviguer('settings')">
          ⚙️ Paramètres
        </div>
        <div class="menu-item"
             onclick="naviguer('offline')">
          📵 Mode hors-ligne
        </div>
        <div class="menu-item"
             onclick="naviguer('social')">
          📱 Partage réseaux
        </div>
        <div class="menu-item"
             onclick="Utils.exporterJSON()">
          📤 Exporter données
        </div>
        <div class="menu-separator"></div>
        <div class="menu-item menu-danger"
             onclick="UI.confirmerReset()">
          🗑️ Réinitialiser
        </div>
      </div>
    </div>

    <!-- CONTENU PRINCIPAL -->
    <main id="app-main" class="app-main">

      <!-- Pages principales -->
      <div id="page-home"
           class="page active"
           data-page="home">
      </div>
      <div id="page-training"
           class="page"
           data-page="training">
      </div>
      <div id="page-live"
           class="page"
           data-page="live">
      </div>
      <div id="page-stats"
           class="page"
           data-page="stats">
      </div>
      <div id="page-profil"
           class="page"
           data-page="profil">
      </div>

      <!-- Pages secondaires -->
      <div id="page-coach"       class="page"></div>
      <div id="page-defis"       class="page"></div>
      <div id="page-predict"     class="page"></div>
      <div id="page-share"       class="page"></div>
      <div id="page-gamification"class="page"></div>
      <div id="page-history"     class="page"></div>
      <div id="page-photos"      class="page"></div>
      <div id="page-social"      class="page"></div>
      <div id="page-supersets"   class="page"></div>
      <div id="page-offline"     class="page"></div>
      <div id="page-settings"    class="page"></div>
      <div id="page-nutrition"   class="page"></div>
      <div id="page-profile"     class="page"></div>

    </main>

    <!-- NAVIGATION BAS -->
    <nav id="app-nav" class="app-nav">
      <button class="nav-btn active"
              id="nav-home"
              onclick="naviguer('home')"
              data-page="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Accueil</span>
      </button>
      <button class="nav-btn"
              id="nav-training"
              onclick="naviguer('training')"
              data-page="training">
        <span class="nav-icon">📅</span>
        <span class="nav-label">Programme</span>
      </button>
      <button class="nav-btn nav-btn-live"
              id="nav-live"
              onclick="naviguer('live')"
              data-page="live">
        <span class="nav-icon">⚡</span>
        <span class="nav-label">Live</span>
      </button>
      <button class="nav-btn"
              id="nav-stats"
              onclick="naviguer('stats')"
              data-page="stats">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Stats</span>
      </button>
      <button class="nav-btn"
              id="nav-profil"
              onclick="naviguer('profil')"
              data-page="profil">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Profil</span>
      </button>
    </nav>

  </div><!-- fin #app-wrapper -->

  <!-- ══════════════════════════════════════════
       MODALS
  ══════════════════════════════════════════ -->

  <!-- Modal Info -->
  <div id="modal-info" class="modal hidden">
    <div class="modal-overlay"
         onclick="document.getElementById('modal-info')
           .classList.add('hidden')">
    </div>
    <div class="modal-inner">
      <button id="modal-info-close"
              class="modal-close"
              onclick="document.getElementById('modal-info')
                .classList.add('hidden')">✕</button>
      <div id="modal-info-content"
           class="modal-content"></div>
    </div>
  </div>

  <!-- Modal Confirm -->
  <div id="modal-confirm" class="modal hidden">
    <div class="modal-overlay"></div>
    <div class="modal-inner modal-sm">
      <div class="modal-content">
        <div id="modal-confirm-title"
             style="font-size:1.1rem;font-weight:700;
                    margin-bottom:var(--space-sm)">
        </div>
        <div id="modal-confirm-msg"
             style="font-size:.88rem;
                    color:var(--text-muted);
                    margin-bottom:var(--space-lg)">
        </div>
        <div style="display:grid;
                    grid-template-columns:1fr 1fr;
                    gap:var(--space-sm)">
          <button id="modal-confirm-non"
                  class="btn-secondary">
            Annuler
          </button>
          <button id="modal-confirm-oui"
                  class="btn-primary">
            Confirmer
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Langue -->
  <div id="modal-lang" class="modal hidden">
    <div class="modal-overlay"
         onclick="document.getElementById('modal-lang')
           .classList.add('hidden')">
    </div>
    <div class="modal-inner modal-sm">
      <button class="modal-close"
              onclick="document.getElementById('modal-lang')
                .classList.add('hidden')">✕</button>
      <div id="modal-lang-content"
           class="modal-content"></div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"
       style="position:fixed;
              bottom:calc(var(--nav-height,64px) + 16px);
              left:50%;transform:translateX(-50%);
              z-index:10000;
              display:flex;flex-direction:column;
              align-items:center;gap:8px;
              pointer-events:none;
              width:calc(100% - 32px);
              max-width:400px">
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"
          style="position:fixed;inset:0;
                 pointer-events:none;
                 z-index:9998">
  </canvas>

  <!-- Update Banner -->
  <div id="update-banner" class="hidden"
       style="position:fixed;top:0;left:0;right:0;
              z-index:9990;background:var(--fd-indigo);
              color:white;padding:8px 16px;
              display:flex;align-items:center;
              justify-content:space-between;
              font-size:.85rem;font-weight:600">
    <span>🆕 Nouvelle version disponible !</span>
    <button id="btn-update"
            style="background:white;color:var(--fd-indigo);
                   border:none;border-radius:6px;
                   padding:4px 12px;font-weight:700;
                   cursor:pointer">
      Mettre à jour
    </button>
  </div>

  <!-- ══════════════════════════════════════════
       SCRIPTS
  ══════════════════════════════════════════ -->

  <!-- CDN Chart.js (optionnel) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- 1. Core -->
  <script src="./js/utils.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/programme.js"></script>
  <script src="./js/tracker.js"></script>

  <!-- 2. Features -->
  <script src="./js/gamification.js"></script>
  <script src="./js/stats.js"></script>
  <script src="./js/coach.js"></script>
  <script src="./js/notifications.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/nutrition.js"></script>
  <script src="./js/exercice-videos.js"></script>

  <!-- 3. Features v2 -->
  <script src="./js/defis.js"></script>
  <script src="./js/share.js"></script>
  <script src="./js/predict.js"></script>

  <!-- 4. Nouveaux modules v3.0 ✅ -->
  <script src="./js/superset.js"></script>
  <script src="./js/photos.js"></script>
  <script src="./js/history.js"></script>
  <script src="./js/offline.js"></script>
  <script src="./js/social.js"></script>

  <!-- 5. Auth UI -->
  <script src="./js/auth-ui.js"></script>

  <!-- 6. App — TOUJOURS EN DERNIER -->
  <script src="./js/app.js"></script>

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js')
          .then(reg => {
            console.log('✅ SW registered');

            // Bouton mise à jour
            reg.addEventListener('updatefound', () => {
              const nw = reg.installing;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed'
                    && navigator.serviceWorker.controller) {
                  const banner = document.getElementById(
                    'update-banner'
                  );
                  if (banner) {
                    banner.classList.remove('hidden');
                    banner.style.display = 'flex';
                  }
                  document.getElementById('btn-update')
                    ?.addEventListener('click', () => {
                      nw.postMessage({ type:'SKIP_WAITING' });
                      window.location.reload();
                    });
                }
              });
            });
          })
          .catch(err => console.warn('SW:', err));

        // Messages SW
        navigator.serviceWorker.addEventListener(
          'message', (e) => {
            if (e.data?.type === 'SYNC_REQUESTED') {
              try { Offline.syncPendingQueue(); } catch(e) {}
            }
          }
        );
      });
    }
  </script>

</body>
</html>
